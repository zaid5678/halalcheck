# Render Blueprint for the HalalCheck API. In Render: New > Blueprint > select this repository.
# Docker is used (rather than Render's Python runtime) because OCR needs the Tesseract system
# package installed.
services:
  - type: web
    name: halalcheck-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Your Vercel site URL(s), comma-separated, e.g. https://halalcheck.vercel.app
      - key: HALALCHECK_CORS_ORIGINS
        sync: false
      # The free instance has 512 MB RAM and a fraction of a CPU: process one image at a time.
      - key: HALALCHECK_OCR_MAX_CONCURRENCY
        value: "1"
      - key: HALALCHECK_LOG_LEVEL
        value: INFO
