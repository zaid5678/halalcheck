# Render Blueprint for the HalalCheck API. In Render: New > Blueprint > select this repository.
services:
  - type: web
    name: halalcheck-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Your Vercel site URL(s), comma-separated, e.g. https://halalcheck.vercel.app
      - key: HALALCHECK_CORS_ORIGINS
        sync: false
      # OpenRouter API key for photo checks and ingredient review. Set it in the Render dashboard.
      - key: HALALCHECK_OPENROUTER_API_KEY
        sync: false
      # Open Food Facts asks for a real contact email: HalalCheck/0.1 (you@example.com)
      - key: HALALCHECK_OFF_USER_AGENT
        sync: false
      - key: HALALCHECK_LOG_LEVEL
        value: INFO
