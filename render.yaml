# Render Blueprint for the HalalCheck API. In Render: New > Blueprint > select this repository.
services:
  - type: web
    name: halalcheck-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Your Vercel site URL(s), comma-separated, e.g. https://your-site.vercel.app
      - key: HALALCHECK_CORS_ORIGINS
        sync: false
      # OpenRouter API key for ingredient analysis (https://openrouter.ai/keys). Secret.
      - key: OPENROUTER_API_KEY
        sync: false
      # Any OpenRouter model with image input and structured outputs.
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: HALALCHECK_LOG_LEVEL
        value: INFO
